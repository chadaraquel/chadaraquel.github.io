<style>
  :root {
    --oliva: #6E6A2C;
    --oliva-escuro: #55521F;
    --amarelo: #FAE393;
    --creme: #FFFDF4;
    --papel: #FFFEF8;
    --tinta: #4A4722;
    --sombra: rgba(85, 82, 31, .18);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: #F3EAC8;
    color: var(--tinta);
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-variant-numeric: lining-nums;
    -webkit-tap-highlight-color: transparent;
  }
  .palco {
    min-height: 100vh; min-height: 100dvh;
    display: grid; place-items: center;
  }
  #cartao {
    display: block;
    width: min(100vw, calc(100dvh * 1080 / 1920));
    height: auto;
    box-shadow: 0 18px 50px var(--sombra);
  }
  /* Celular em pé: o SVG ocupa a tela inteira; listras e grão, desenhados além do viewBox, preenchem a sobra. */
  @media (max-aspect-ratio: 1080/1920) {
    body { background: var(--amarelo); }
    #cartao { width: 100vw; height: 100vh; height: 100dvh; box-shadow: none; }
  }

  /* Texto do cartão */
  #cartao text { font-variant-numeric: lining-nums; }
  .caps { font-family: 'Cormorant SC', 'Cormorant Garamond', serif; font-weight: 500; fill: var(--oliva); text-anchor: middle; }
  .script { font-family: 'Pinyon Script', cursive; fill: var(--oliva); text-anchor: middle; }
  .serif { font-family: 'Cormorant Garamond', serif; fill: var(--oliva); text-anchor: middle; }
  .rotulo { font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 600; fill: var(--oliva); }

  /* Botões do cartão */
  .botao { cursor: pointer; outline: none; }
  .botao .disco { transition: transform .18s ease; transform-box: fill-box; transform-origin: center; }
  .botao:hover .disco, .botao:focus-visible .disco { transform: scale(1.06); }
  .botao:active .disco { transform: scale(.95); }
  .botao:focus-visible .anel { stroke: var(--oliva-escuro); stroke-width: 4; }
  .pulso { transform-box: fill-box; transform-origin: center; animation: pulso 2.6s ease-out 1.2s 3; opacity: 0; }
  @keyframes pulso { 0% { transform: scale(1); opacity: .55; } 100% { transform: scale(1.45); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .pulso { animation: none; } }
  .so-imagem { display: none; }

  /* Modo imagem (?png): cartão em 1080 x 1920 exatos, sem interação */
  body.png { background: none; }
  body.png .palco { display: block; min-height: 0; }
  body.png #cartao { width: 1080px; height: 1920px; box-shadow: none; }
  body.png .so-imagem { display: inline; }
  body.png .pulso { display: none; }

  /* Folha de confirmação */
  .fundo {
    position: fixed; inset: 0; z-index: 10;
    background: rgba(74, 64, 18, .34);
    display: flex; align-items: flex-end; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity .25s ease;
  }
  .fundo.aberto { opacity: 1; pointer-events: auto; }
  .folha {
    width: min(100%, 520px);
    max-height: 88dvh; overflow: auto;
    background: var(--papel);
    border-radius: 28px 28px 0 0;
    border-top: 3px solid var(--amarelo);
    padding: 26px 26px calc(28px + env(safe-area-inset-bottom));
    transform: translateY(24px); transition: transform .25s ease;
    box-shadow: 0 -10px 40px rgba(60, 57, 20, .22);
  }
  .fundo.aberto .folha { transform: none; }
  @media (min-width: 600px) {
    .fundo { align-items: center; }
    .folha { border-radius: 28px; border: 3px solid var(--amarelo); }
  }
  .folha h2 {
    font-family: 'Pinyon Script', cursive; font-weight: 400;
    color: var(--oliva); font-size: 44px; line-height: 1.1;
    margin: 4px 36px 6px 0;
  }
  .folha p { font-size: 20px; line-height: 1.4; margin: 8px 0 14px; color: var(--tinta); }
  .fechar {
    position: absolute; right: 14px; top: 14px;
    width: 44px; height: 44px; border-radius: 50%;
    border: 0; background: transparent; color: var(--oliva);
    font-size: 30px; line-height: 1; cursor: pointer;
  }
  .folha { position: relative; }
  label { display: block; font-size: 17px; font-weight: 600; letter-spacing: .04em; color: var(--oliva); margin: 14px 0 6px; text-transform: uppercase; }
  input, textarea {
    width: 100%; font: inherit; font-size: 20px; color: var(--tinta);
    padding: 12px 14px; border-radius: 14px;
    border: 1.5px solid #D9D0A6; background: #fff;
  }
  input:focus, textarea:focus { outline: 2px solid var(--oliva); outline-offset: 1px; }
  textarea { min-height: 84px; resize: vertical; }
  .acoes { display: grid; gap: 10px; margin-top: 20px; }
  .btn {
    font: inherit; font-size: 21px; font-weight: 600;
    padding: 14px 18px; border-radius: 999px; cursor: pointer;
    border: 1.5px solid var(--oliva); background: transparent; color: var(--oliva);
    text-align: center; text-decoration: none; display: block;
  }
  .btn.principal { background: var(--oliva); color: #fff; }
  .btn:active { transform: scale(.98); }
  .erro { color: #9B3B1E; font-size: 17px; min-height: 1em; margin: 8px 0 0; }
  .ok { text-align: center; }
  .ok .limao { font-size: 46px; margin: 4px 0; }
  .tamanhos { display: grid; grid-template-columns: 1fr auto; gap: 0; margin: 10px 0 6px; border-top: 1px solid #ECE3BD; }
  .tamanhos dt, .tamanhos dd { margin: 0; padding: 12px 2px; border-bottom: 1px solid #ECE3BD; font-size: 20px; }
  .tamanhos dd { font-weight: 700; color: var(--oliva); text-align: right; }
  .nota { font-size: 18px; font-style: italic; color: #6A6640; }
</style>

      <h2 id="t-rsvp">Confirmar presença</h2>
      <p><span id="oi"></span>Sábado, 31 de outubro, às 14h30, na Fábula de Doces. Confirme até 25 de outubro.</p>
      <label for="nome">Seu nome</label>
      <input id="nome" autocomplete="name" placeholder="Como a Raquel te chama">
      <label for="recado">Recadinho para a noiva <span style="text-transform:none;font-weight:400">(opcional)</span></label>
      <textarea id="recado" placeholder="Mal posso esperar!"></textarea>
      <p class="erro" id="erro" role="alert"></p>
      <div class="acoes">
        <button class="btn principal" type="button" data-resposta="vou">Vou, com certeza! 🍋</button>
        <button class="btn" type="button" data-resposta="nao">Não vou conseguir ir</button>
      </div>
    </div>
    <div id="rsvp-ok" class="ok" hidden>
      <div class="limao" aria-hidden="true">🍋</div>
      <h2 id="ok-titulo" style="margin-right:0">Presença confirmada!</h2>
      <p id="ok-texto"></p>
      <div class="acoes">
        <a class="btn principal" id="ok-agenda" target="_blank" rel="noopener">Salvar na agenda</a>
        <button class="btn" type="button" data-fechar>Voltar ao convite</button>
      </div>
    </div>
  </section>
</div>

<script>
  const CONFIG = {
    // Vazio: a confirmação vai pelo WhatsApp da Raquel, com o nome e o recado na mensagem.
    endpoint: 'https://script.google.com/macros/s/AKfycbyAXmo2RiM4PkDjSkAs7SOox_x3owz0ZkAE5DxTpQ6MJocaiz2KEgcJ8VjBiuGr1mFBGg/exec',
    whatsapp: '5565996488383',
    mapa: 'https://www.google.com/maps/search/?api=1&query=' +
      encodeURIComponent('Fábula de Doces, Av. Fernando Corrêa da Costa, 1178, Pico do Amor, Cuiabá - MT'),
    agenda: 'https://calendar.google.com/calendar/render?action=TEMPLATE' +
      '&text=' + encodeURIComponent('Chá de Lingerie') +
      '&dates=20261031T183000Z/20261031T213000Z' +
      '&location=' + encodeURIComponent('Fábula de Doces, Av. Fernando Corrêa da Costa, 1178, Pico do Amor, Cuiabá - MT') +
      '&details=' + encodeURIComponent('Convite: https://chadaraquel.github.io/'),
  };

  if (new URLSearchParams(location.search).has('png')) document.body.classList.add('png');

  document.getElementById('btn-local').setAttribute('href', CONFIG.mapa);
  document.getElementById('ok-agenda').href = CONFIG.agenda;

  let ultimoFoco = null;
  function abrir(id) {
    ultimoFoco = document.activeElement;
    const f = document.getElementById(id);
    f.classList.add('aberto'); f.setAttribute('aria-hidden', 'false');
    const alvo = f.querySelector('input, .btn.principal, .btn');
    setTimeout(() => alvo && alvo.focus({ preventScroll: true }), 50);
  }
  function fechar() {
    document.querySelectorAll('.fundo.aberto').forEach(f => { f.classList.remove('aberto'); f.setAttribute('aria-hidden', 'true'); });
    if (ultimoFoco) ultimoFoco.focus({ preventScroll: true });
  }
  function ligar(id, acao) {
    const el = document.getElementById(id);
    el.addEventListener('click', acao);
    el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); acao(); } });
  }
  ligar('btn-rsvp', () => abrir('fundo-rsvp'));
  document.querySelectorAll('[data-fechar]').forEach(b => b.addEventListener('click', fechar));
  document.querySelectorAll('.fundo').forEach(f => f.addEventListener('click', e => { if (e.target === f) fechar(); }));
  document.addEventListener('keydown', e => { if (e.key === 'Escape') fechar(); });

  const campoNome = document.getElementById('nome');
  const campoRecado = document.getElementById('recado');
  try { campoNome.value = localStorage.getItem('cha-nome') || ''; } catch (_) {}

  function mostrarOk(resposta, nome) {
    document.getElementById('rsvp-form').hidden = true;
    document.getElementById('rsvp-ok').hidden = false;
    const vou = resposta === 'vou';
    document.getElementById('ok-titulo').textContent = vou ? 'Presença confirmada!' : 'Que pena!';
    document.getElementById('ok-agenda').hidden = !vou;
    const primeiro = nome.split(' ')[0];
    document.getElementById('ok-texto').textContent = CONFIG.endpoint
      ? (vou ? `Obrigada, ${primeiro}! A Raquel já vai saber. Nos vemos no dia 31/10, às 14h30.`
             : `Obrigada por avisar, ${primeiro}. A Raquel vai sentir sua falta!`)
      : 'Abrimos o WhatsApp da Raquel com a mensagem pronta. É só tocar em enviar.';
  }

  const botoesResposta = document.querySelectorAll('[data-resposta]');

  async function responder(resposta) {
    const nome = campoNome.value.trim().replace(/\s+/g, ' ');
    const recado = campoRecado.value.trim();
    const erro = document.getElementById('erro');
    if (!nome) { erro.textContent = 'Escreva seu nome, por favor.'; campoNome.focus(); return; }
    erro.textContent = '';
    try { localStorage.setItem('cha-nome', nome); } catch (_) {}

    const texto = resposta === 'vou'
      ? `Oi, Raquel! Aqui é ${nome} e confirmo presença no seu Chá de Lingerie, sábado, 31/10, às 14h30, na Fábula de Doces. 🍋`
      : `Oi, Raquel! Aqui é ${nome}. Infelizmente não vou conseguir ir ao seu Chá de Lingerie no dia 31/10.`;
    const whatsapp = `https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(texto + (recado ? '\n\n' + recado : ''))}`;

    if (CONFIG.endpoint) {
      // Confirmação direta: grava na planilha e a Raquel é avisada pelo vigia (avisar_raquel.py).
      botoesResposta.forEach(b => { b.disabled = true; });
      try {
        await fetch(CONFIG.endpoint, {
          method: 'POST', mode: 'no-cors',
          body: new URLSearchParams({ nome, resposta, recado, codigo }),
        });
        mostrarOk(resposta, nome);
      } catch (_) {
        // Sem rede: o toque seguinte é da própria pessoa, então o navegador não bloqueia o WhatsApp.
        erro.textContent = 'Não consegui registrar agora (sem internet?). ';
        const link = document.createElement('a');
        link.href = whatsapp; link.target = '_blank'; link.rel = 'noopener';
        link.textContent = 'Avise a Raquel pelo WhatsApp';
        erro.append(link);
      } finally {
        botoesResposta.forEach(b => { b.disabled = false; });
      }
      return;
    }
    window.open(whatsapp, '_blank');
    mostrarOk(resposta, nome);
  }
  botoesResposta.forEach(b => b.addEventListener('click', () => responder(b.dataset.resposta)));

  // chadaraquel.github.io/#confirmar abre direto a folha de confirmação.
  if (location.hash === '#confirmar') abrir('fundo-rsvp');

  // Link por convidada (?c=código): o nome vem da planilha, não da página, para a lista não ficar pública.
  const codigo = (new URLSearchParams(location.search).get('c') || '').trim().slice(0, 40);
  if (codigo && CONFIG.endpoint) {
    // `c` é reservado do Apps Script; lá o parâmetro se chama `convidada`.
    fetch(`${CONFIG.endpoint}?convidada=${encodeURIComponent(codigo)}`)
      .then(r => r.json())
      .then(d => {
        if (!d.ok || !d.nome) return;
        document.getElementById('saudacao').textContent = `para ${d.nome}`;
        document.getElementById('oi').textContent = `Oi, ${d.nome}! `;
        if (!campoNome.value) campoNome.value = d.nome;
      })
      .catch(() => {});
  }
</script>
</body>
</html>
